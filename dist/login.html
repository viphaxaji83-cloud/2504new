<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход в редактор — МГТУ</title><link rel="icon" type="image/svg+xml" href="assets/favicon.svg"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="brand.css"><link rel="stylesheet" href="admin-auth.css"><script src="login.js" defer></script><link rel="stylesheet" href="logos.css"></head>
<body class="login-body"><main class="login-card"><a class="brand" href="index.html" aria-label="МГТУ — на главную"><img src="assets/logo-white.png" alt="Логотип МГТУ" width="128" height="64"></a><span class="login-eyebrow">РЕДАКТОР САЙТА</span><h1>С возвращением.</h1><p>Войдите, чтобы обновить содержание сайта.</p><form id="loginForm"><label>Логин<input name="login" autocomplete="username" required maxlength="80" autofocus></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><p id="loginError" class="form-message" role="alert" aria-live="polite"></p><button class="button dark-button" type="submit">Войти</button></form><p id="setupHint" hidden>Первого администратора создаёт ответственный за сервер командой <code>docker compose exec web node server/create-admin.mjs admin</code>. Пароль задаётся в терминале.</p><a class="login-back" href="index.html">На сайт</a></main></body></html>
